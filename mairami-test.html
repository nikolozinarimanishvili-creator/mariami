<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>მაირამის ტესტი</title>
<meta name="description" content="სრულიად უაზრო უნივერსიტეტის ექსპერიმენტი." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+Georgian:wght@400;500&family=Noto+Sans+Georgian:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #fbf6ef;
    --blush: #f4d6d6;
    --blush-deep: #e8b4b8;
    --lavender: #d9cdef;
    --lavender-deep: #9d8ac7;
    --ink: #2a2330;
    --ink-soft: #6b6275;
    --white-glass: rgba(255,255,255,0.55);
    --shadow: 0 18px 50px -20px rgba(70, 40, 80, 0.35);
    --serif: "Noto Serif Georgian", "Cormorant Garamond", Georgia, serif;
    --sans: "Noto Sans Georgian", "Inter", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 10% -10%, var(--blush) 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, var(--lavender) 0%, transparent 60%),
      var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
    position: relative;
  }

  .card {
    width: 100%;
    max-width: 560px;
    text-align: center;
    position: relative;
    z-index: 2;
    animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(.99); filter: blur(4px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }

  @keyframes fadeOut {
    to { opacity: 0; transform: translateY(-10px); filter: blur(3px); }
  }
  .leaving { animation: fadeOut .35s ease forwards; pointer-events: none; }

  /* Floating decorations */
  .deco { position: fixed; pointer-events: none; z-index: 1; opacity: .8; }
  .deco.star { top: 12%; right: 12%; width: 56px; animation: float 7s ease-in-out infinite; }
  .deco.flower { bottom: 14%; left: 9%; width: 84px; animation: float 9s ease-in-out infinite reverse; }
  .deco.orb { top: 60%; right: 6%; width: 22px; opacity: .6; animation: float 6s ease-in-out infinite; }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(12deg); }
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--lavender-deep);
    margin-bottom: 22px;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(44px, 10vw, 76px);
    line-height: .95;
    letter-spacing: -.01em;
  }
  h1 em { font-style: italic; color: var(--blush-deep); font-weight: 400; }

  .subtitle {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(19px, 3.6vw, 24px);
    color: var(--ink-soft);
    margin-top: 18px;
  }

  .fine {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 26px;
    letter-spacing: .02em;
    opacity: .85;
  }

  .btn {
    margin-top: 42px;
    font: inherit;
    font-size: 15px;
    letter-spacing: .06em;
    color: var(--ink);
    background: var(--white-glass);
    border: 1px solid rgba(42, 35, 48, .15);
    padding: 16px 34px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    box-shadow: var(--shadow);
    transition: transform .3s ease, box-shadow .3s ease, background .3s ease, color .3s ease;
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.7) 50%, transparent 70%);
    transform: translateX(-120%);
    transition: transform .8s ease;
  }
  .btn:hover:not(:disabled)::after { transform: translateX(120%); }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 24px 60px -18px rgba(70,40,80,.45); background: var(--ink); color: var(--cream); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn:focus-visible { outline: 2px solid var(--lavender-deep); outline-offset: 4px; }

  /* Progress */
  .progress {
    display: flex; gap: 10px; justify-content: center; align-items: center;
    margin-bottom: 40px;
  }
  .progress .dot {
    width: 34px; height: 3px; border-radius: 3px;
    background: rgba(42,35,48,.12);
    transition: background .5s ease, width .5s ease;
  }
  .progress .dot.done { background: var(--blush-deep); }
  .progress .dot.now { background: var(--lavender-deep); width: 56px; }
  .progress-label {
    font-size: 11px; letter-spacing: .24em; text-transform: uppercase;
    color: var(--ink-soft); margin-bottom: 16px; display: block;
  }

  /* Question */
  .qtext {
    font-family: var(--serif);
    font-size: clamp(30px, 6vw, 42px);
    line-height: 1.1;
    font-weight: 500;
    margin-bottom: 38px;
    text-wrap: balance;
  }

  .options { display: grid; gap: 12px; text-align: left; }

  .option {
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    text-align: left;
    padding: 18px 22px;
    border-radius: 18px;
    background: var(--white-glass);
    border: 1px solid rgba(42,35,48,.08);
    cursor: pointer;
    display: flex; align-items: center; gap: 16px;
    transition: transform .35s cubic-bezier(.2,.7,.2,1), background .35s ease, border-color .35s ease, box-shadow .35s ease;
    backdrop-filter: blur(6px);
    animation: optIn .6s cubic-bezier(.2,.7,.2,1) both;
    animation-delay: var(--d, 0s);
  }
  @keyframes optIn {
    from { opacity: 0; transform: translateX(-12px); }
    to { opacity: 1; transform: none; }
  }
  .option .mark {
    flex: 0 0 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid rgba(42,35,48,.25);
    display: grid; place-items: center;
    transition: all .35s ease;
  }
  .option .mark::after {
    content: ""; width: 10px; height: 10px; border-radius: 50%;
    background: var(--ink); transform: scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1);
  }
  .option:hover {
    transform: translateX(6px);
    background: rgba(255,255,255,.85);
    box-shadow: 0 12px 30px -16px rgba(70,40,80,.35);
  }
  .option.selected {
    background: linear-gradient(135deg, var(--blush) 0%, var(--lavender) 100%);
    border-color: transparent;
    box-shadow: 0 16px 36px -18px rgba(120, 70, 110, .5);
    transform: translateX(6px) scale(1.01);
  }
  .option.selected .mark { border-color: var(--ink); }
  .option.selected .mark::after { transform: scale(1); }

  .nav {
    margin-top: 40px;
    display: flex; justify-content: center;
    min-height: 56px;
  }

  /* Analyzing */
  .analyze-wrap { min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .orbit {
    width: 120px; height: 120px; position: relative; margin-bottom: 34px;
  }
  .orbit .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px dashed rgba(157,138,199,.5);
    animation: spin 6s linear infinite;
  }
  .orbit .ring.r2 { inset: 18px; border-style: solid; border-color: rgba(232,180,184,.6); animation-duration: 4s; animation-direction: reverse; }
  .orbit .core {
    position: absolute; inset: 42px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, var(--blush-deep));
    box-shadow: 0 0 40px rgba(232,180,184,.9);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  .analyze-msg {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    color: var(--ink-soft);
    min-height: 32px;
    transition: opacity .4s ease;
  }
  .bar {
    width: 220px; height: 2px; background: rgba(42,35,48,.1);
    border-radius: 2px; margin-top: 26px; overflow: hidden;
  }
  .bar span {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--blush-deep), var(--lavender-deep));
    transition: width .6s ease;
  }
  .pct { font-size: 12px; letter-spacing: .2em; margin-top: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* Reveal */
  .reveal-kicker {
    font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--lavender-deep); margin-bottom: 20px;
    opacity: 0; animation: fadeIn 1s ease .2s forwards;
  }
  .congrats {
    font-family: var(--serif);
    font-size: clamp(40px, 9vw, 64px);
    font-weight: 500; line-height: 1;
    opacity: 0; animation: fadeUp 1.1s cubic-bezier(.2,.7,.2,1) .5s forwards;
  }
  .congrats .spark { color: var(--blush-deep); font-style: italic; }
  .line {
    font-family: var(--serif); font-size: 22px; color: var(--ink-soft);
    margin-top: 26px; opacity: 0; animation: fadeUp 1s ease forwards;
  }
  .line.l1 { animation-delay: 1.6s; }
  .line.l2 { animation-delay: 3.4s; }
  .line.l2 strong { font-style: italic; color: var(--ink); font-weight: 500; }
  .reveal-next { opacity: 0; animation: fadeIn 1s ease 4.6s forwards; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); filter: blur(3px);} to { opacity: 1; transform: none; filter: blur(0);} }
  @keyframes fadeIn { to { opacity: 1; } }

  /* Final */
  .final-title {
    font-family: var(--serif); font-size: clamp(42px, 9vw, 64px); font-weight: 500; line-height: 1;
  }
  .final-title em { color: var(--blush-deep); }
  .final-lines { margin-top: 30px; display: grid; gap: 14px; }
  .final-lines p {
    font-family: var(--serif); font-size: clamp(19px, 3.6vw, 23px); color: var(--ink-soft);
    opacity: 0; animation: fadeUp .9s ease forwards;
  }
  .final-lines p:nth-child(1) { animation-delay: .3s; }
  .final-lines p:nth-child(2) { animation-delay: 1.2s; }
  .final-lines p:nth-child(3) { animation-delay: 2.1s; }
  .final-lines p:nth-child(4) { animation-delay: 3s; color: var(--ink); }
  .final-lines p:nth-child(4) span.smile { display: inline-block; animation: wiggle 2.8s ease-in-out 3.5s infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }

  .replay {
    margin-top: 48px;
    font: inherit; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    background: none; border: none; color: var(--ink-soft); cursor: pointer;
    padding: 10px 14px; border-radius: 10px;
    transition: color .3s ease, letter-spacing .3s ease;
    opacity: 0; animation: fadeIn 1s ease 4.2s forwards;
  }
  .replay:hover { color: var(--ink); letter-spacing: .2em; }
  .replay:focus-visible { outline: 2px solid var(--lavender-deep); }

  .intro-btn-wrap { opacity: 0; animation: fadeIn 1s ease .9s forwards; }
  .intro-fine { opacity: 0; animation: fadeIn 1s ease 1.2s forwards; }

  button:focus-visible { outline: 2px solid var(--lavender-deep); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  @media (max-width: 480px) {
    .deco.star { width: 40px; top: 8%; right: 6%; }
    .deco.flower { width: 60px; bottom: 6%; left: 4%; }
    .option { padding: 16px 18px; font-size: 15px; }
    .qtext { margin-bottom: 28px; }
  }
</style>
</head>
<body>

<svg class="deco star" viewBox="0 0 100 100" aria-hidden="true">
  <path d="M50 4 C54 38, 62 46, 96 50 C62 54, 54 62, 50 96 C46 62, 38 54, 4 50 C38 46, 46 38, 50 4Z" fill="none" stroke="#9d8ac7" stroke-width="1.4"/>
  <circle cx="50" cy="50" r="5" fill="#e8b4b8"/>
</svg>
<svg class="deco flower" viewBox="0 0 120 120" aria-hidden="true">
  <g fill="#f4d6d6" stroke="#e8b4b8" stroke-width="1">
    <ellipse cx="60" cy="30" rx="18" ry="26"/>
    <ellipse cx="60" cy="90" rx="18" ry="26"/>
    <ellipse cx="30" cy="60" rx="26" ry="18"/>
    <ellipse cx="90" cy="60" rx="26" ry="18"/>
  </g>
  <circle cx="60" cy="60" r="10" fill="#d9cdef"/>
</svg>
<div class="deco orb" style="background:#d9cdef;border-radius:50%;"></div>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const QUESTIONS = [
  {
    q: "გულწრფელად. ვიღაცამ დღეები გაატარა შენთვის რაღაცის გასაკეთებლად. პირველი რეაქცია?",
    options: [
      "ეკრანის ანაბეჭდი მაშინვე.",
      "მოიცა… ვინ გააკეთა ეს?",
      "ვითომ არ მაინტერესებს. (მაინტერესებს.)",
      "მეგობარს მაშინვე დავურეკავ."
    ]
  },
  {
    q: "თუ ეს საიტი შეძლებდა ერთი რამის თქმას შენთან, რა იქნებოდა ყველაზე სავარაუდო?",
    options: [
      "\u201Cდღეს შენ ცოტა მაგია გეკუთვნის.\u201D",
      "\u201Cშენზე ვფიქრობდი იმაზე მეტად, ვიდრე ვაღიარებ.\u201D",
      "\u201Cეს ალბათ ზედმეტია, არაფერს.\u201D",
      "\u201Cგთხოვ, არავის უთხრა, რამდენი ხანი დამჭირდა.\u201D"
    ]
  },
  {
    q: "უკანასკნელი კითხვა: გაგეღიმა მინიმუმ ერთხელ?",
    options: [
      "დიახ, რა თქმა უნდა.",
      "ცოტა მაინც.",
      "ძალიან ვცდილობ, რომ არ გამეღიმოს.",
      "მეცნიერული სიზუსტე: საეჭვო."
    ]
  }
];

const ANALYSIS_STEPS = [
  "კალიბრირდება ყავაზე დამოკიდებულების ინდექსი…",
  "იზომება ორშაბათის დილის გამძლეობა…",
  "ვადარებ ლექტორის დაპირებებს…",
  "ვიყენებ ძალიან სერიოზულ დაფას…",
  "ვამოწმებ უჩვეულოდ მაღალ დონის ხიბლს…",
  "ვასრულებ შედეგებს (მეცნიერს ნუ შეაწუხებთ)…"
];

function Progress({ index, total, answered }) {
  return (
    <>
      <span className="progress-label">კითხვა {index + 1} / {total}</span>
      <div className="progress" aria-hidden="true">
        {Array.from({ length: total }).map((_, i) => (
          <span
            key={i}
            className={
              "dot " + (i < index || (i === index && answered && i < total - 1 && false) ? "done" : "") +
              (i === index ? " now" : "")
            }
          />
        ))}
      </div>
    </>
  );
}

function Intro({ onBegin, leaving }) {
  return (
    <div className={"card " + (leaving ? "leaving" : "")}>
      <div className="eyebrow">ექსპერიმენტი No. 01</div>
      <h1><em>მაირამის</em><br/>ტესტი</h1>
      <p className="subtitle">"სრულიად უაზრო უნივერსიტეტის ექსპერიმენტი."</p>
      <p className="fine intro-fine">დაახლოებითი დრო: 2 წუთი. მეცნიერული სიზუსტე: საეჭვო.</p>
      <div className="intro-btn-wrap">
        <button className="btn" onClick={onBegin}>ექსპერიმენტის დაწყება →</button>
      </div>
    </div>
  );
}

function Question({ index, selected, onSelect, onNext, onBack, leaving }) {
  const item = QUESTIONS[index];
  const hasAnswer = selected !== undefined && selected !== null;
  const isLast = index === QUESTIONS.length - 1;
  return (
    <div className={"card " + (leaving ? "leaving" : "")} key={index}>
      <Progress index={index} total={QUESTIONS.length} answered={hasAnswer} />
      <h2 className="qtext">{item.q}</h2>
      <div className="options" role="radiogroup" aria-label={item.q}>
        {item.options.map((opt, i) => (
          <button
            key={i}
            role="radio"
            aria-checked={selected === i}
            className={"option " + (selected === i ? "selected" : "")}
            style={{ "--d": (i * 0.07) + "s" }}
            onClick={() => onSelect(i)}
          >
            <span className="mark" aria-hidden="true"></span>
            <span>{opt}</span>
          </button>
        ))}
      </div>
      <div className="nav" style={{ justifyContent: "space-between", alignItems: "center" }}>
        <button className="replay" style={{ opacity: 1, animation: "none" }} onClick={onBack}>← უკან</button>
        <button className="btn" style={{ marginTop: 0 }} disabled={!hasAnswer} onClick={onNext}>
          {isLast ? "ანალიზი →" : "შემდეგი →"}
        </button>
      </div>
    </div>
  );
}

function Analyzing({ onDone }) {
  const [step, setStep] = useState(0);
  const [pct, setPct] = useState(0);
  useEffect(() => {
    const total = 4200;
    const start = performance.now();
    let raf;
    const tick = (now) => {
      const p = Math.min(100, Math.round(((now - start) / total) * 100));
      setPct(p);
      if (p < 100) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    const stepTimer = setInterval(() => {
      setStep(s => (s + 1) % ANALYSIS_STEPS.length);
    }, 700);
    const done = setTimeout(() => { clearInterval(stepTimer); onDone(); }, total + 400);
    return () => { cancelAnimationFrame(raf); clearInterval(stepTimer); clearTimeout(done); };
  }, []);
  return (
    <div className="card analyze-wrap">
      <div className="orbit" aria-hidden="true">
        <div className="ring"></div>
        <div className="ring r2"></div>
        <div className="core"></div>
      </div>
      <p className="eyebrow" style={{ marginBottom: 14 }}>შენი პასუხების ანალიზი</p>
      <p className="analyze-msg" key={step}>{ANALYSIS_STEPS[step]}</p>
      <div className="bar"><span style={{ width: pct + "%" }}></span></div>
      <div className="pct">{pct}%</div>
    </div>
  );
}

function Reveal({ onContinue }) {
  useEffect(() => {
    const t = setTimeout(onContinue, 9000);
    return () => clearTimeout(t);
  }, []);
  return (
    <div className="card">
      <div className="reveal-kicker">შედეგები</div>
      <h2 className="congrats">გილოცავ, <span className="spark">მაირამი.</span></h2>
      <p className="line l1">წარმატებით დაასრულე ძალიან მნიშვნელოვანი ექსპერიმენტი.</p>
      <p className="line l2">სინამდვილეში ექსპერიმენტი არ არსებობდა. <strong>უბრალოდ მინდოდა მიზეზი მქონოდა, რაღაც საინტერესო შემექმნა.</strong></p>
      <div className="reveal-next">
        <button className="btn" onClick={onContinue}>გაგრძელება →</button>
      </div>
    </div>
  );
}

function Final({ onReplay }) {
  return (
    <div className="card">
      <div className="eyebrow">ბოლო შენიშვნები</div>
      <h2 className="final-title">კარგი, <em>მაირამი…</em></h2>
      <div className="final-lines">
        <p>ეს პატარა ექსპერიმენტი მხოლოდ იმისთვის შეიქმნა, რომ გაგეღიმა.</p>
        <p>თუ გამოვიდა, მისია შესრულებულია.</p>
        <p>და თუ მოგინდება საუბარი, იცი, სად მიპოვო. <span className="smile">:)</span></p>
        <p style={{ fontSize: "clamp(16px,3vw,18px)", fontStyle: "italic", color: "var(--ink-soft)" }}>
          პასუხი არ მოითხოვება. არასდროს.
        </p>
      </div>
      <button className="replay" onClick={onReplay}>↺ თავიდან ნახვა</button>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("intro");
  const [qIndex, setQIndex] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [leaving, setLeaving] = useState(false);

  const transition = (fn, delay = 350) => {
    setLeaving(true);
    setTimeout(() => { fn(); setLeaving(false); }, delay);
  };

  const begin = () => transition(() => { setScreen("q"); setQIndex(0); setAnswers([]); });

  const select = (i) => {
    setAnswers(a => { const copy = [...a]; copy[qIndex] = i; return copy; });
  };

  const next = () => {
    if (answers[qIndex] === undefined) return;
    if (qIndex < QUESTIONS.length - 1) {
      transition(() => setQIndex(qIndex + 1), 300);
    } else {
      transition(() => setScreen("analyzing"));
    }
  };

  const back = () => {
    if (qIndex > 0) transition(() => setQIndex(qIndex - 1), 300);
  };

  const replay = () => transition(() => { setScreen("intro"); setQIndex(0); setAnswers([]); });

  return (
    <div className="stage">
      {screen === "intro" && <Intro onBegin={begin} leaving={leaving} />}
      {screen === "q" && (
        <Question
          index={qIndex}
          selected={answers[qIndex]}
          onSelect={select}
          onNext={next}
          onBack={back}
          leaving={leaving}
        />
      )}
      {screen === "analyzing" && <Analyzing onDone={() => setScreen("reveal")} />}
      {screen === "reveal" && <Reveal onContinue={() => setScreen("final")} />}
      {screen === "final" && <Final onReplay={replay} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
